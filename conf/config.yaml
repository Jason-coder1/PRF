defaults:
  - datamodule: av2 
  - model: model_forecast
hydra:
  run:
    dir: outputs/${output}/${now:%Y%m%d-%H%M%S}

seed: 2024
monitor: val_new_minFDE6
save_top_k: 5

data_root:
checkpoint:
pretrained_weights:
output: change_${datamodule.name}_${datamodule.phase}_${model.name}_${model.phase}
future_steps: 60

# trainer
num_workers: 8
gpus: [0, 1, 2, 3, 4, 5, 6, 7]
sync_bn: true
batch_size: 16
epochs: 60
warmup_epochs: 10

# optimizer
lr: 0.003
weight_decay: 1e-2
gradient_clip_val: 5
gradient_clip_algorithm: norm


align_weight_start: 0.05
align_weight_end: 0.5
align_weight_warmup_epochs: 10

limit_train_batches:
limit_val_batches:

limit_test_batches:
log_model: all
test: False
